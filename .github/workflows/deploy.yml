name: Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: main
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      
      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x
      
      - name: Generate Fresh manifest
        run: deno run -A --unstable dev.ts build
      
      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        with:
          project: "amz-pic-analyze-dashboard"
          entrypoint: "main.ts"
          import-map: "import_map.json"
